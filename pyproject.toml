[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[project]
name = "moonboard-analysis"
version = "0.1.0"
description = "Moonboard climbing route analysis with autoencoders and LSTM grade prediction"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2",
    "matplotlib>=3.7,<4",
    "torch>=2.0,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "seaborn>=0.12,<1",
    "adjustText>=1.0,<2",
    "gradio>=5.0,<6",
    "mlflow>=2.10,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0,<2",
    "pytest>=8.0,<9",
    "mypy>=1.10,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
moonboard-train-ae = "moonboard_analysis.scripts.train_autoencoder:main"
moonboard-compare-pca = "moonboard_analysis.scripts.compare_pca:main"
moonboard-train-lstm = "moonboard_analysis.scripts.train_lstm:main"
moonboard-evaluate-lstm = "moonboard_analysis.scripts.evaluate_lstm:main"
moonboard-viz-ae = "moonboard_analysis.scripts.launch_autoencoder_viz:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moonboard_analysis"]
include = ["src/moonboard_analysis/scripts/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
strict = false
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=8.4.2",
    "ruff>=0.15.12",
    "xdoctest>=1.3.2",
]
